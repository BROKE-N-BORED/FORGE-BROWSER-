# Forge Browser — run the offline test suite on every push.
#
# The suite is standard library only, so no dependencies are needed
# and no network access is required. A red HEAD is caught here, at
# push time, instead of being found by hand later.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v
